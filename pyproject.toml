[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "har-sensor-context"
version = "0.1.0"
description = "UCI-HAR sensor classifier and frozen-LLM context prototype"
requires-python = ">=3.11,<3.12"
dependencies = [
  "numpy==1.26.0",
  "scikit-learn==1.7.2",
  "scipy==1.16.3",
  "torch==2.9.0",
  "transformers==5.4.0",
]

[dependency-groups]
dev = ["pytest==8.4.2"]

[tool.setuptools.packages.find]
where = ["src"]
